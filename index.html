        let trendChart = echarts.init(document.getElementById('trendChart'));

        function initUI() {
            let picker = document.getElementById('datePicker');
            picker.value = latestFullDate;
            picker.min = allHistoryData[0].date;
            picker.max = latestFullDate;
            let expStart = document.getElementById('exportStartDate');
            let expEnd = document.getElementById('exportEndDate');
            expStart.value = allHistoryData[0].date;
            expStart.min = allHistoryData[0].date;
            expStart.max = latestFullDate;
            expEnd.value = latestFullDate;
            expEnd.min = allHistoryData[0].date;
            expEnd.max = latestFullDate;
        }

        function renderSinglePie(chartInstance, data, colorMain) {
            chartInstance.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}辆 ({d}%)' },
                color: ['#f1c40f', colorMain],
                series: [{ type: 'pie', radius: ['40%', '70%'], center: ['50%', '45%'], label: { formatter: '{b}\n{c}辆\n{d}%', fontSize: 12 }, data: [{ value: data.no, name: '不抬杆' }, { value: data.yes, name: '抬杆' }] }]
            });
        }

        function updateK1Data(selectedDate) {
            let dayData = allHistoryData.find(item => item.date === selectedDate);
            if(!dayData || !dayData.k1) return;
            let k1 = dayData.k1;
            document.getElementById('tableDateLabel').innerText = selectedDate;
            renderSinglePie(k1InCnChart, k1.in_cn, '#2ecc71'); 
            renderSinglePie(k1InVnChart, k1.in_vn, '#1abc9c'); 
            renderSinglePie(k1OutCnChart, k1.out_cn, '#3498db'); 
            renderSinglePie(k1OutVnChart, k1.out_vn, '#9b59b6'); 
            document.getElementById('tb-in-cn-total').innerText = k1.in_cn.total;
            document.getElementById('tb-in-cn-yes').innerText = k1.in_cn.yes;
            document.getElementById('tb-in-cn-no').innerText = k1.in_cn.no;
            document.getElementById('tb-in-cn-rate').innerText = k1.in_cn.rate + '%';
            document.getElementById('tb-in-vn-total').innerText = k1.in_vn.total;
            document.getElementById('tb-in-vn-yes').innerText = k1.in_vn.yes;
            document.getElementById('tb-in-vn-no').innerText = k1.in_vn.no;
            document.getElementById('tb-in-vn-rate').innerText = k1.in_vn.rate + '%';
            document.getElementById('tb-out-cn-total').innerText = k1.out_cn.total;
            document.getElementById('tb-out-cn-yes').innerText = k1.out_cn.yes;
            document.getElementById('tb-out-cn-no').innerText = k1.out_cn.no;
            document.getElementById('tb-out-cn-rate').innerText = k1.out_cn.rate + '%';
            document.getElementById('tb-out-vn-total').innerText = k1.out_vn.total;
            document.getElementById('tb-out-vn-yes').innerText = k1.out_vn.yes;
            document.getElementById('tb-out-vn-no').innerText = k1.out_vn.no;
            document.getElementById('tb-out-vn-rate').innerText = k1.out_vn.rate + '%';
        }

        function onDateChange() { updateK1Data(document.getElementById('datePicker').value); }

        function switchMainView(viewType, btn) {
            document.querySelectorAll('#mainViewBtns button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('subViewBtns_month').style.display = viewType === 'month' ? 'flex' : 'none';
            if (viewType === 'day') renderTrend('day', '7d', null);
            else if (viewType === 'month') document.querySelectorAll('#subViewBtns_month button')[0].click();
            else renderTrend('year', 'all', null);
        }

        function renderTrend(mainView, subView, btn) {
            if(btn) {
                let parentId = btn.parentElement.id;
                document.querySelectorAll(`#${parentId} button`).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            let xData = [], cnData = [], vnData = [], yAxisName = '数量 (辆)';
            if (mainView === 'day') {
                let endDate = new Date(latestFullDate), startDate = new Date(latestFullDate);
                startDate.setDate(endDate.getDate() - 7); 
                let filtered = allHistoryData.filter(item => new Date(item.date) >= startDate && new Date(item.date) <= endDate);
                xData = filtered.map(item => item.date.substring(5)); 
                cnData = filtered.map(item => item.trucks.cn_heavy);
                vnData = filtered.map(item => item.trucks.vn_heavy);
            }
            if (mainView === 'month') {
                yAxisName = '日均数量 (辆)';
                let currentYear = new Date(latestFullDate).getFullYear();
                let targetYear = subView === 'thisYear' ? currentYear : currentYear - 1;
                let grouped = {};
                for(let i=1; i<=12; i++) grouped[`${targetYear}-${String(i).padStart(2, '0')}`] = { cn:0, vn:0, count:0 };
                allHistoryData.forEach(item => {
                    if (item.date.startsWith(targetYear.toString())) {
                        let key = item.date.substring(0, 7);
                        grouped[key].cn += item.trucks.cn_heavy;
                        grouped[key].vn += item.trucks.vn_heavy;
                        grouped[key].count += 1;
                    }
                });
                Object.keys(grouped).forEach(key => {
                    let c = grouped[key].count;
                    if (c > 0) {
                        xData.push(parseInt(key.split('-')[1]) + '月');
                        cnData.push(Number((grouped[key].cn / c).toFixed(1)));
                        vnData.push(Number((grouped[key].vn / c).toFixed(1)));
                    }
                });
            }
            if (mainView === 'year') {
                yAxisName = '日均数量 (辆)';
                let grouped = {};
                allHistoryData.forEach(item => {
                    let year = item.date.substring(0, 4);
                    if (!grouped[year]) grouped[year] = { cn:0, vn:0, count:0 };
                    grouped[year].cn += item.trucks.cn_heavy;
                    grouped[year].vn += item.trucks.vn_heavy;
                    grouped[year].count += 1;
                });
                Object.keys(grouped).sort().forEach(year => {
                    xData.push(year + '年');
                    let c = grouped[year].count;
                    cnData.push(Number((grouped[year].cn / c).toFixed(1)));
                    vnData.push(Number((grouped[year].vn / c).toFixed(1)));
                });
            }
            trendChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { data: ['中国重车', '越南重车'], top: 0 },
                grid: { top: 40, bottom: 30, left: 50, right: 30 },
                xAxis: { type: 'category', data: xData },
                yAxis: { type: 'value', name: yAxisName },
                series: [
                    { name: '中国重车', type: 'bar', data: cnData, itemStyle: { color: '#3498db' }, label: { show: true, position: 'top', fontSize: 11, color: '#3498db' } },
                    { name: '越南重车', type: 'bar', data: vnData, itemStyle: { color: '#e74c3c' }, label: { show: true, position: 'top', fontSize: 11, color: '#e74c3c' } }
                ]
            }, true); 
        }

        function downloadCSV() {
            let startStr = document.getElementById('exportStartDate').value;
            let endStr = document.getElementById('exportEndDate').value;
            if(!startStr || !endStr) return alert("请先选择开始和截止时间！");
            if(startStr > endStr) return alert("开始时间不能晚于截止时间！");
            let exportData = allHistoryData.filter(item => item.date >= startStr && item.date <= endStr);
            if(exportData.length === 0) return alert("选定时间段内没有数据。");
            let csvContent = "\uFEFF日期,总进出数,总抬杆率(%),卡1进中国空车总数,卡1进中国空车抬杆,卡1进中国空车不抬杆,卡1进越南重车总数,卡1进越南重车抬杆,卡1进越南重车不抬杆,卡1出中国重车总数,卡1出中国重车抬杆,卡1出中国重车不抬杆,卡1出越南空车总数,卡1出越南空车抬杆,卡1出越南空车不抬杆\n";
            exportData.forEach(item => {
                let row = [item.date, item.total, item.rate, item.k1.in_cn.total, item.k1.in_cn.yes, item.k1.in_cn.no, item.k1.in_vn.total, item.k1.in_vn.yes, item.k1.in_vn.no, item.k1.out_cn.total, item.k1.out_cn.yes, item.k1.out_cn.no, item.k1.out_vn.total, item.k1.out_vn.yes, item.k1.out_vn.no];
                csvContent += row.join(",") + "\n";
            });
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `数字口岸数据_${startStr}至${endStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        initUI();
        updateK1Data(latestFullDate);
        document.querySelectorAll('#mainViewBtns button')[0].click();
    </script>
</body>
</html>
